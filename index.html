<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>Ewidencja animatorów</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f5f7;color:#1c1c1e;font-size:16px}
  .wrap{max-width:640px;margin:0 auto;padding:12px 12px 40px}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  h1{font-size:22px;margin:0}
  input,select,button{font:inherit;color:inherit}
  input[type=date],input[type=time],input[type=email],input[type=password],input[type=text],select{
    padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff;width:100%;min-height:44px}
  button{min-height:44px;padding:10px 14px;border:0;border-radius:10px;background:#e5e7eb;cursor:pointer}
  button:disabled{opacity:.45;cursor:default}
  .primary{background:#2563eb;color:#fff}
  .danger{background:#fee2e2;color:#b91c1c}
  .warn{background:#f59e0b;color:#fff}
  .small{min-height:36px;padding:6px 12px;font-size:14px}
  .full{width:100%}
  .card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card.onbreak{background:#fff8e1;outline:2px solid #f59e0b}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .name{font-weight:600;font-size:18px;background:none;padding:0;min-height:auto;text-align:left;color:#1d4ed8}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:#e5e7eb;white-space:nowrap}
  .chip.work{background:#dcfce7;color:#166534}
  .chip.brk{background:#fef3c7;color:#92400e}
  .chip.done{background:#e0e7ff;color:#3730a3}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .times label,.lbl{font-size:12px;color:#666;display:block;margin-bottom:2px}
  .stats{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#444;margin-top:8px}
  .over{color:#c00;font-weight:600}
  .ok{color:#15803d}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  details{background:#fff;border-radius:14px;padding:12px;margin:10px 0}
  summary{font-weight:600;cursor:pointer}
  #log div{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
  .hidden{display:none!important}
  .muted{color:#666;font-size:13px}
  .field{margin:10px 0}
  dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .check{display:flex;align-items:center;gap:10px;min-height:44px}
  .check input{width:22px;height:22px}
  .brow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin:6px 0;align-items:center}
  .brow button{min-height:44px;padding:0 12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Animatorzy</h1>
    <button id="logoutBtn" class="small hidden">Wyloguj</button>
  </header>

  <div id="loginBox" class="card">
    <div class="field"><input id="email" type="email" placeholder="mail@topart.pl" autocomplete="username"></div>
    <div class="field"><input id="pass" type="password" placeholder="Hasło" autocomplete="current-password"></div>
    <div class="row">
      <button id="loginBtn" class="primary">Zaloguj</button>
      <button id="registerBtn">Załóż konto</button>
    </div>
    <p class="muted">Tylko adresy @topart.pl i @qmk.pl.</p>
  </div>

  <div id="app" class="hidden">
    <div class="muted" id="who"></div>
    <div class="field"><input type="date" id="day"></div>

    <div id="cards"></div>

    <details>
      <summary>Dodaj animatora</summary>
      <div class="row" style="margin-top:10px">
        <input id="newName" type="text" placeholder="Imię">
        <button id="addBtn" class="primary" style="flex:0 0 auto">Dodaj</button>
      </div>
    </details>

    <details>
      <summary>Raport Excel</summary>
      <div class="row" style="margin-top:10px">
        <div><span class="lbl">Od</span><input type="date" id="from"></div>
        <div><span class="lbl">Do</span><input type="date" id="to"></div>
      </div>
      <button id="exportBtn" class="primary full" style="margin-top:10px">Pobierz Excel</button>
    </details>

    <details>
      <summary>Historia dnia</summary>
      <div id="log"></div>
    </details>
  </div>
</div>

<dialog id="profile">
  <h2 id="pName" style="margin:0 0 8px"></h2>
  <div class="field"><span class="lbl">Umowa</span><select id="pContract"></select></div>
  <label class="check"><input type="checkbox" id="pStudent"> Student</label>
  <label class="check"><input type="checkbox" id="pOver26"> Powyżej 26 lat</label>
  <div class="field">
    <span class="lbl" id="pDayLbl" style="font-weight:600;color:#1c1c1e;font-size:14px">Czas pracy</span>
    <div class="times" style="margin:6px 0">
      <div><label>Przyjście</label><input type="time" id="pArrival"></div>
      <div><label>Wyjście</label><input type="time" id="pDeparture"></div>
    </div>
    <span class="lbl">Przerwy (od – do)</span>
    <div id="pBreaks"></div>
    <div id="pOngoing" class="muted"></div>
    <button id="pAddBreak" class="small full" style="margin-top:6px">+ Dodaj przerwę</button>
  </div>
  <div class="row" style="margin-top:12px">
    <button id="pSave" class="primary">Zapisz</button>
    <button id="pClose">Zamknij</button>
  </div>
  <button id="pRemove" class="danger full" style="margin-top:8px">Usuń z listy</button>
</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendEmailVerification, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, getDocs,
  where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCr6KixI2htKunS1tFo69ull_E6CcXCZ0c",
  authDomain: "ewidencja-czasu-pracy-e4ae8.firebaseapp.com",
  projectId: "ewidencja-czasu-pracy-e4ae8",
  storageBucket: "ewidencja-czasu-pracy-e4ae8.firebasestorage.app",
  messagingSenderId: "984879703659",
  appId: "1:984879703659:web:a2949424013db0f695b32e"
};

const DOMAINS = /@(topart|qmk)\.pl$/i;
const CONTRACTS = ["Umowa o pracę", "Zlecenie", "B2B", "Inna"];
const LABELS = { contract: "umowa", student: "student", over26: "26+" };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

$("day").value = new Date().toLocaleDateString("sv-SE");
$("from").value = $("to").value = $("day").value;
$("pContract").innerHTML = CONTRACTS.map(c => `<option>${c}</option>`).join("");

let user = null, shifts = {}, people = {}, ANIMATORS = [], current = null;
let unsubShifts = null, unsubLog = null, unsubPeople = null;

// ---------- Logowanie ----------
$("loginBtn").onclick = async () => {
  try {
    const cred = await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    if (!cred.user.emailVerified) {
      await sendEmailVerification(cred.user);
      alert("Mail nie jest potwierdzony. Wysłałem link ponownie – kliknij go i zaloguj się jeszcze raz.");
      await signOut(auth);
    }
  } catch (e) { alert("Błąd logowania: " + e.message); }
};

$("registerBtn").onclick = async () => {
  const email = $("email").value.trim();
  if (!DOMAINS.test(email)) return alert("Tylko adresy @topart.pl lub @qmk.pl");
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, $("pass").value);
    await sendEmailVerification(cred.user);
    alert("Sprawdź skrzynkę (także spam) i kliknij link potwierdzający, potem zaloguj się.");
    await signOut(auth);
  } catch (e) { alert("Błąd: " + e.message); }
};

$("logoutBtn").onclick = () => signOut(auth);
$("day").onchange = subscribe;

onAuthStateChanged(auth, u => {
  user = (u && u.emailVerified) ? u : null;
  $("loginBox").classList.toggle("hidden", !!user);
  $("logoutBtn").classList.toggle("hidden", !user);
  $("app").classList.toggle("hidden", !user);
  $("who").textContent = user ? "Zalogowano: " + user.email : "";
  if (user) { subscribe(); subscribeAnimators(); }
});

// ---------- Dane ----------
function subscribe() {
  if (!user) return;
  const day = $("day").value;
  unsubShifts && unsubShifts(); unsubLog && unsubLog();
  unsubShifts = onSnapshot(query(collection(db, "shifts"), where("day", "==", day)), snap => {
    shifts = {}; snap.forEach(d => shifts[d.data().name] = d.data()); render();
  }, err => alert("Brak dostępu: " + err.message));
  unsubLog = onSnapshot(query(collection(db, "logs"), where("day", "==", day), orderBy("ts", "desc")), snap => {
    $("log").innerHTML = snap.docs.map(d => {
      const l = d.data(), t = l.ts ? l.ts.toDate().toLocaleTimeString("pl-PL") : "";
      return `<div>${t} – <b>${esc(l.user)}</b>: ${esc(l.action)} (${esc(l.name)})</div>`;
    }).join("") || `<div class="muted">Brak wpisów</div>`;
  }, err => console.log(err.message));
}

function subscribeAnimators() {
  unsubPeople && unsubPeople();
  unsubPeople = onSnapshot(collection(db, "animators"), snap => {
    people = {};
    snap.forEach(d => { const p = d.data(); if (p.active !== false) people[p.name] = p; });
    ANIMATORS = Object.keys(people).sort((a, b) => a.localeCompare(b, "pl"));
    render();
  });
}

// ---------- Obliczenia ----------
const now = () => new Date().toTimeString().slice(0, 5);
const toMin = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmt = m => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, "0")}m`;

function breakTotal(s) {
  let sum = (s.breaks || []).reduce((a, b) => a + (toMin(b.end) - toMin(b.start)), 0);
  if (s.breakStart) sum += toMin(now()) - toMin(s.breakStart);
  return sum;
}
// Kodeks pracy art. 134: ≥6h → 15 min, >9h → 30 min, >16h → 45 min
function breakLimit(workMin) {
  if (workMin > 16 * 60) return 45;
  if (workMin > 9 * 60) return 30;
  if (workMin >= 6 * 60) return 15;
  return 0;
}
const limitFor = (name, work) => breakLimit(work); // dla wszystkich umów

// ---------- Zapis ----------
async function logAction(name, action) {
  await addDoc(collection(db, "logs"), { day: $("day").value, name, action,
    user: user.email, ts: serverTimestamp() });
}

async function save(name, data, action) {
  const day = $("day").value;
  await setDoc(doc(db, "shifts", `${day}_${name}`), { day, name, ...data }, { merge: true });
  await logAction(name, action);
}

const setTime = (name, field, val) =>
  save(name, { [field]: val }, `${field === "arrival" ? "przyjście" : "wyjście"}: ${val || "usunięto"}`);

function toggleBreak(name) {
  const s = shifts[name] || {};
  if (!s.breakStart) return save(name, { breakStart: now() }, `start przerwy ${now()}`);
  const b = { start: s.breakStart, end: now() };
  const len = toMin(b.end) - toMin(b.start);
  save(name, { breaks: [...(s.breaks || []), b], breakStart: null }, `koniec przerwy ${now()} (${len} min)`);
}

$("addBtn").onclick = async () => {
  const name = $("newName").value.trim().replace(/\//g, "-");
  if (!name) return;
  await setDoc(doc(db, "animators", name),
    { name, contract: "Zlecenie", student: false, over26: false, active: true });
  await logAction(name, "dodano animatora");
  $("newName").value = "";
};

// ---------- Widok kart ----------
function render() {
  // nie przerywaj wpisywania godziny
  if (document.activeElement && document.activeElement.type === "time") return;
  if (!ANIMATORS.length) {
    $("cards").innerHTML = `<div class="card muted">Brak animatorów – dodaj ich poniżej.</div>`;
    return;
  }
  $("cards").innerHTML = ANIMATORS.map(n => {
    const s = shifts[n] || {}, e = esc(n);
    const start = toMin(s.arrival);
    const end = toMin(s.departure) ?? (s.arrival ? toMin(now()) : null);
    const work = start != null && end != null ? end - start : 0;
    const br = breakTotal(s), lim = limitFor(n, work);
    const [chipCls, chipTxt] =
      s.breakStart ? ["brk", "Na przerwie"] :
      s.departure ? ["done", "Wyszedł"] :
      s.arrival ? ["work", "W pracy"] : ["", "Nieobecny"];
    return `<div class="card ${s.breakStart ? "onbreak" : ""}">
      <div class="top">
        <button class="name" data-act="profile" data-name="${e}">${e} ›</button>
        <span class="chip ${chipCls}">${chipTxt}</span>
      </div>
      <div class="times">
        <div><label>Przyjście</label><input type="time" data-field="arrival" data-name="${e}" value="${s.arrival || ""}"></div>
        <div><label>Wyjście</label><input type="time" data-field="departure" data-name="${e}" value="${s.departure || ""}"></div>
      </div>
      <button class="full ${s.breakStart ? "warn" : ""}" data-act="break" data-name="${e}" ${s.arrival ? "" : "disabled"}>
        ${s.breakStart ? "Koniec przerwy (od " + s.breakStart + ")" : "Start przerwy"}
      </button>
      <div class="stats">
        <span class="${br > lim ? "over" : "ok"}">Przerwy: ${br} / ${lim} min</span>
        <span>Praca: ${work ? fmt(work) : "–"}</span>
      </div>
    </div>`;
  }).join("");
}

$("cards").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "break") toggleBreak(b.dataset.name);
  if (b.dataset.act === "profile") openProfile(b.dataset.name);
});
$("cards").addEventListener("change", e => {
  const i = e.target;
  if (i.dataset.field) setTime(i.dataset.name, i.dataset.field, i.value);
});
$("cards").addEventListener("focusout", () => setTimeout(render, 0));

// ---------- Profil ----------
let editBreaks = [];

function renderBreakRows() {
  $("pBreaks").innerHTML = editBreaks.length
    ? editBreaks.map((b, i) => `<div class="brow">
        <input type="time" data-i="${i}" data-k="start" value="${b.start || ""}">
        <input type="time" data-i="${i}" data-k="end" value="${b.end || ""}">
        <button class="danger" data-del="${i}" title="Usuń przerwę">✕</button>
      </div>`).join("")
    : `<div class="muted" style="padding:4px 0">Brak przerw</div>`;
}

$("pBreaks").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.k) editBreaks[+t.dataset.i][t.dataset.k] = t.value;
});
$("pBreaks").addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  editBreaks.splice(+b.dataset.del, 1); renderBreakRows();
});
$("pAddBreak").onclick = () => { editBreaks.push({ start: "", end: "" }); renderBreakRows(); };

function openProfile(n) {
  current = n;
  const p = people[n] || {}, s = shifts[n] || {};
  $("pName").textContent = n;
  $("pContract").value = p.contract || "Zlecenie";
  $("pStudent").checked = !!p.student;
  $("pOver26").checked = !!p.over26;
  $("pDayLbl").textContent = `Czas pracy – ${$("day").value}`;
  $("pArrival").value = s.arrival || "";
  $("pDeparture").value = s.departure || "";
  editBreaks = (s.breaks || []).map(b => ({ ...b }));
  $("pOngoing").textContent = s.breakStart ? `Trwa przerwa od ${s.breakStart} (zakończ ją przyciskiem na karcie).` : "";
  renderBreakRows();
  $("profile").showModal();
}

$("pClose").onclick = () => $("profile").close();

$("pSave").onclick = async () => {
  const n = current, p = people[n] || {}, s = shifts[n] || {};

  // --- walidacja czasu pracy ---
  const arrival = $("pArrival").value, departure = $("pDeparture").value;
  if (arrival && departure && toMin(departure) <= toMin(arrival))
    return alert("Wyjście musi być później niż przyjście.");
  const breaks = editBreaks.filter(b => b.start || b.end);
  for (const b of breaks) {
    if (!b.start || !b.end) return alert("Uzupełnij obie godziny każdej przerwy.");
    if (toMin(b.end) <= toMin(b.start)) return alert(`Przerwa ${b.start}–${b.end}: koniec musi być po początku.`);
  }
  breaks.sort((a, b) => toMin(a.start) - toMin(b.start));

  // --- dane osobowe ---
  const upd = { contract: $("pContract").value, student: $("pStudent").checked, over26: $("pOver26").checked };
  const old = { contract: p.contract || "", student: !!p.student, over26: !!p.over26 };
  const changed = Object.keys(upd).filter(k => old[k] !== upd[k]);
  if (changed.length) {
    await setDoc(doc(db, "animators", n), upd, { merge: true });
    for (const k of changed) {
      const v = typeof upd[k] === "boolean" ? (upd[k] ? "tak" : "nie") : upd[k];
      await logAction(n, `zmiana: ${LABELS[k]} → ${v}`);
    }
  }

  // --- korekta czasu pracy ---
  const fmtBr = arr => arr.map(b => `${b.start}–${b.end}`).join(", ") || "brak";
  const notes = [];
  if ((s.arrival || "") !== arrival) notes.push(`przyjście ${s.arrival || "–"} → ${arrival || "–"}`);
  if ((s.departure || "") !== departure) notes.push(`wyjście ${s.departure || "–"} → ${departure || "–"}`);
  if (fmtBr(s.breaks || []) !== fmtBr(breaks)) notes.push(`przerwy ${fmtBr(s.breaks || [])} → ${fmtBr(breaks)}`);
  if (notes.length) await save(n, { arrival, departure, breaks }, "korekta: " + notes.join("; "));

  $("profile").close();
};

$("pRemove").onclick = async () => {
  if (!confirm(`Usunąć ${current} z listy?`)) return;
  await setDoc(doc(db, "animators", current), { active: false }, { merge: true });
  await logAction(current, "usunięto z listy");
  $("profile").close();
};

// ---------- Raport Excel ----------
$("exportBtn").onclick = async () => {
  const from = $("from").value, to = $("to").value;
  const snap = await getDocs(query(collection(db, "shifts"),
    where("day", ">=", from), where("day", "<=", to)));

  const rows = [], summary = {};
  snap.docs.map(d => d.data())
    .sort((a, b) => a.day.localeCompare(b.day) || a.name.localeCompare(b.name))
    .forEach(s => {
      const work = (s.arrival && s.departure) ? toMin(s.departure) - toMin(s.arrival) : 0;
      const breaks = s.breaks || [];
      const brSum = breaks.reduce((a, b) => a + toMin(b.end) - toMin(b.start), 0);
      const lim = limitFor(s.name, work);
      const p = people[s.name] || {};
      rows.push({
        "Data": s.day, "Animator": s.name, "Umowa": p.contract || "",
        "Student": p.student ? "tak" : "nie", "26+": p.over26 ? "tak" : "nie",
        "Przyjście": s.arrival || "", "Wyjście": s.departure || "",
        "Czas pracy": work ? fmt(work) : "",
        "Przerwy (godziny)": breaks.map(b => `${b.start}–${b.end}`).join(", "),
        "Suma przerw [min]": brSum, "Limit [min]": lim,
        "Przekroczenie [min]": Math.max(0, brSum - lim)
      });
      const sum = summary[s.name] ??= { dni: 0, praca: 0, przerwy: 0, przekr: 0 };
      sum.dni++; sum.praca += work; sum.przerwy += brSum; sum.przekr += Math.max(0, brSum - lim);
    });

  const sumRows = Object.entries(summary).map(([n, x]) => {
    const p = people[n] || {};
    return {
      "Animator": n, "Umowa": p.contract || "",
      "Student": p.student ? "tak" : "nie", "26+": p.over26 ? "tak" : "nie",
      "Dni pracy": x.dni, "Łączny czas pracy": fmt(x.praca),
      "Godziny (liczba)": +(x.praca / 60).toFixed(2),
      "Suma przerw [min]": x.przerwy, "Suma przekroczeń [min]": x.przekr
    };
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Szczegóły");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sumRows), "Podsumowanie");
  XLSX.writeFile(wb, `raport_${from}_${to}.xlsx`);
  await logAction("-", `eksport raportu ${from} – ${to}`);
};

setInterval(render, 30000); // odświeżanie liczników co 30 s
</script>
</body>
</html>
